name: Bridge ARM64 packer secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Copy encrypted secret to ARM64 builder.
        env:
          GH_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$PACKER_PRIVATE_H"
          gh secret set PACKER_PRIVATE_H \
            --repo Kindness-Net/AyuGramDesktop-Plus-Windows-ARM64-Build \
            --body "$PACKER_PRIVATE_H"
          echo 'PACKER_PRIVATE_H uploaded to the ARM64 builder.'
