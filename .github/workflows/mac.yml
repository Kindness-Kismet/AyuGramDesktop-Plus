name: MacOS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'scripts/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'scripts/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: MacOS
    runs-on: macos-latest
    timeout-minutes: 359

    env:
      PREPARE_PATH: 'Telegram/build/prepare/prepare.py'

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          set -euo pipefail
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Spotlight indexing only slows the dependency build down.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Build dependencies.
        run: |
          set -euo pipefail
          # 正式版不传 skip-release，依赖按 Release 配置编译
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up disk space.
        run: |
          set -euo pipefail
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # 瘦身后立即入库，后续构建失败不再连带丢失依赖缓存
      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Build AyuGram Desktop.
        run: |
          set -euo pipefail
          cd $REPO_NAME/Telegram

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ../out --config Release --parallel

      - name: Check release output.
        run: |
          set -euo pipefail
          appPath="$REPO_NAME/out/Release/AyuGram.app"
          if test -d "$appPath"; then
            echo "Build successfully done! :)"
          else
            echo "Build error, output bundle does not exist."
            exit 1
          fi

      - name: Package release output.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppVersionStrSmall //p' $REPO_NAME/Telegram/build/version)
          test -n "$version"
          cd $REPO_NAME/out/Release
          rm -f "AyuGram-v${version}-macos.zip"
          zip -r "AyuGram-v${version}-macos.zip" AyuGram.app
          test ! -f Updater || zip "AyuGram-v${version}-macos.zip" Updater

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-macOS
          path: ${{ env.REPO_NAME }}/out/Release/AyuGram-v*-macos.zip
          retention-days: 7
