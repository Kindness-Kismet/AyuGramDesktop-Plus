name: Cross-repo smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            repository: Kindness-Net/AyuGramDesktop-Plus-Windows-Build
          - name: Linux
            repository: Kindness-Net/AyuGramDesktop-Plus-Linux-Build
          - name: macOS
            repository: Kindness-Net/AyuGramDesktop-Plus-macOS-Build

    steps:
      - name: Check out orchestration code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Dispatch and wait for remote checks.
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          BUILD_REPOSITORY: ${{ matrix.repository }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.remote_build import GitHubApi, run_remote_build

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def record_dispatch(repository: str, run_id: int, url: str) -> None:
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"### {os.environ['BUILD_NAME']} smoke\n\n")
                  output.write(f"[{repository} run {run_id}]({url})\n")

          details = run_remote_build(
              GitHubApi(os.environ["REMOTE_BUILD_TOKEN"]),
              repository=os.environ["BUILD_REPOSITORY"],
              workflow="checks.yml",
              ref="main",
              inputs={},
              timeout_seconds=300,
              poll_interval_seconds=5,
              on_dispatched=record_dispatch,
          )
          with summary.open("a", encoding="utf-8") as output:
              output.write(f"\nResult: success (attempt {details.run_attempt})\n")
          PY
