name: Migrate build signing secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Copy signing secret to build repositories
    if: github.actor == 'KiritoXDone'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure repository secrets.
        env:
          GH_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$PACKER_PRIVATE_H"

          repositories=(
            Kindness-Net/AyuGramDesktop-Plus-Windows-Build
            Kindness-Net/AyuGramDesktop-Plus-Linux-Build
            Kindness-Net/AyuGramDesktop-Plus-macOS-Build
          )

          for repository in "${repositories[@]}"; do
            printf '%s' "$PACKER_PRIVATE_H" \
              | gh secret set PACKER_PRIVATE_H --repo "$repository" >/dev/null 2>&1
            printf '%s: success\n' "$repository"
          done
