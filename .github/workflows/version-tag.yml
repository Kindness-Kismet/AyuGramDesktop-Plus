name: Version tag

on:
  push:
    branches:
      - main
    paths:
      - 'Telegram/build/version'

permissions:
  contents: read

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release when the version changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read version.
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppVersionStrSmall //p' Telegram/build/version)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Require release notes for this version.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py \
            .github/CHANGELOG.md "$VERSION" "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create the release tag.
        env:
          # GITHUB_TOKEN 推送的 tag 不会触发其他工作流，必须用 PAT 才能带起 Release。
          GH_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)
          if test -n "$existing"; then
            if test "$existing" = "$GITHUB_SHA"; then
              echo "::notice::${TAG} already points at this commit."
            else
              echo "::warning::${TAG} exists at ${existing}; refusing to move it."
            fi
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}"
          echo "::notice::Created ${TAG}; the Release workflow takes over from here."
