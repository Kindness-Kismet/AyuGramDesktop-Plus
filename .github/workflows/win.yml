name: Windows

on:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/build/prepare/mac.sh'
      - 'Telegram/build/prepare/linux.sh'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/build/prepare/mac.sh'
      - 'Telegram/build/prepare/linux.sh'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: 'true'
      # 每个 cl.exe 各映射一份约 514 MB 的 PCH，runner 只有 16 GB，
      # 并发开满会撞提交上限并报 C3859/C1076。
      BUILD_JOBS: '4'

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Free up some disk space.
        shell: bash
        run: |
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files/Microsoft SDKs/Azure" || true
          df -h /c

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: build/tmp/Libraries
          key: ${{ runner.OS }}-libs-${{ hashFiles('scripts/build_support/recipes.py') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        shell: cmd
        run: python scripts/prebuild.py

      - name: AyuGram Desktop build.
        shell: cmd
        run: python scripts/build.py --jobs %BUILD_JOBS%

      - name: Check.
        shell: bash
        run: |
          filePath="build/packages/release/AyuGram.exe"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"
            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: AyuGram-Windows-x64
          path: build/packages/release/
          retention-days: 7
