name: Windows

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/build/prepare/mac.sh'
      - 'Telegram/build/prepare/linux.sh'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/build/prepare/mac.sh'
      - 'Telegram/build/prepare/linux.sh'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 359

    env:
      # /m 与 /MP 相乘耗尽内存会僵死 runner，锁定单项目串行
      AYUGRAM_SINGLE_PROJECT_BUILD: '1'
      # tg_owt 模板单元单个 2 GB 以上，并发顶格 2
      BUILD_JOBS: '2'

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up MSVC.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Free up disk space.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files/Microsoft SDKs/Azure" || true
          df -h /c

      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            build/tmp/Libraries
            build/tmp/ThirdParty
          key: win-libs-${{ hashFiles('scripts/prebuild.py', 'scripts/build_support/recipes.py', 'scripts/build_support/dependency_cache.py') }}
          restore-keys: win-libs-

      # 缓存归档保不住符号链接，msys2 的 mtab 与 dev 由运行时重建
      - name: Clean broken msys2 links.
        if: steps.cache-libs.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/tmp/ThirdParty/msys64/etc/mtab
          rm -rf build/tmp/ThirdParty/msys64/dev || true

      - name: Build dependencies.
        shell: cmd
        run: python scripts/prebuild.py

      # 中间产物不入库可把缓存压到 10 GB 限制内，恢复后阶段标记仍完整
      - name: Trim intermediate build files.
        shell: bash
        run: |
          set -euo pipefail
          find build/tmp/Libraries build/tmp/ThirdParty \
            \( -name '*.obj' -o -name '*.pdb' -o -name '*.pch' \) -type f -delete

      # 依赖建好立即入库，后续构建失败不再连带丢失 prebuild 缓存
      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/tmp/Libraries
            build/tmp/ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      # Packer 是 Telegram 的构建依赖，私钥头文件必须在编译前就位
      - name: Write packer signing key.
        shell: bash
        env:
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$PACKER_PRIVATE_H"
          printf '%s' "$PACKER_PRIVATE_H" > Telegram/SourceFiles/_other/packer_private.h

      - name: Build AyuGram Desktop.
        shell: cmd
        run: python scripts/build.py --jobs %BUILD_JOBS% --pack --clean-pack

      - name: Check release output.
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(ls build/AyuGram-v*-win-x64.zip | head -1)
          test -n "$artifact"
          size=$(stat -c %s "$artifact")
          echo "File size of ${artifact}: ${size} Bytes."

      - name: Pack update.
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppVersion  *//p' Telegram/build/version)
          test -n "$version"
          packer=$(pwd)/build/tmp/out/Release/Packer.exe
          test -f "$packer"
          cd build/AyuGram-v*-win-x64-release
          "$packer" -target win64 -version "$version" \
            -path AyuGram.exe -path Updater.exe
          mv "tx64upd${version}" ../
          ls -l "../tx64upd${version}"

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-Windows-x64
          path: |
            build/AyuGram-v*-win-x64.zip
            build/tx64upd*
          retention-days: 7
